apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tree-planting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: treeplantacr.azurecr.io/tree-planting-auth:latest
          ports:
            - containerPort: 3011
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: tree-planting
spec:
  selector:
    app: auth-service
  ports:
    - port: 3011
      targetPort: 3011
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
  namespace: tree-planting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submission-service
  template:
    metadata:
      labels:
        app: submission-service
    spec:
      containers:
        - name: submission-service
          image: treeplantacr.azurecr.io/tree-planting-submission:latest
          ports:
            - containerPort: 3012
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:3011
---
apiVersion: v1
kind: Service
metadata:
  name: submission-service
  namespace: tree-planting
spec:
  selector:
    app: submission-service
  ports:
    - port: 3012
      targetPort: 3012
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-service
  namespace: tree-planting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: certificate-service
  template:
    metadata:
      labels:
        app: certificate-service
    spec:
      containers:
        - name: certificate-service
          image: treeplantacr.azurecr.io/tree-planting-certificate:latest
          ports:
            - containerPort: 3013
          env:
            - name: SUBMISSION_SERVICE_URL
              value: http://submission-service:3012
---
apiVersion: v1
kind: Service
metadata:
  name: certificate-service
  namespace: tree-planting
spec:
  selector:
    app: certificate-service
  ports:
    - port: 3013
      targetPort: 3013
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tree-planting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: treeplantacr.azurecr.io/tree-planting-gateway:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tree-planting
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
