version: '3.9'

services:
  client:
    build:
      context: ./Client
    container_name: client-app
    ports:
      - "3005:80"
    restart: always

  admin:
    build:
      context: ./admin
    container_name: admin-app
    ports:
      - "3001:80"
    restart: always

  backend:
    build:
      context: ./backend
    container_name: backend-api
    ports:
      - "5001:3000"
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    restart: always
