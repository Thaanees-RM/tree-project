services:
  # API Gateway - Entry point for all requests
  gateway:
    build:
      context: ./services/gateway
    container_name: api-gateway
    ports:
      - "3010:80"
    depends_on:
      - auth-service
      - submission-service
      - certificate-service
    environment:
      - LOG_LEVEL=debug
    restart: always

  # Auth Service - Handles authentication
  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
      - NODE_ENV=development
    restart: always

  # Submission Service - Handles user submissions
  submission-service:
    build:
      context: ./services/submission-service
    container_name: submission-service
    ports:
      - "3012:3012"
    environment:
      - PORT=3012
      - AUTH_SERVICE_URL=http://auth-service:3011
      - NODE_ENV=development
    depends_on:
      - auth-service
    restart: always

  # Certificate Service - Generates certificates
  certificate-service:
    build:
      context: ./services/certificate-service
    container_name: certificate-service
    ports:
      - "3013:3013"
    environment:
      - PORT=3013
      - SUBMISSION_SERVICE_URL=http://submission-service:3012
      - NODE_ENV=development
    depends_on:
      - submission-service
    restart: always

  # MongoDB - Shared database for all services
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tree-plantation
    volumes:
      - mongodb_data:/data/db
    restart: always

  # Prometheus - Monitoring
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

volumes:
  mongodb_data:
