upstream auth_service {
    server auth-service:3011;
}

upstream submission_service {
    server submission-service:3012;
}

upstream certificate_service {
    server certificate-service:3013;
}

server {
    listen 80;
    server_name _;

    # Auth Service routes
    location /api/auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Submission Service routes
    location /api/submissions/ {
        proxy_pass http://submission_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Certificate Service routes
    location /api/certificates/ {
        proxy_pass http://certificate_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        return 200 "API Gateway OK\n";
        add_header Content-Type text/plain;
    }
}
