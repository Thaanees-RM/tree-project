name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - thaanees
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [Client, admin, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint frontend apps
        if: matrix.service == 'Client' || matrix.service == 'admin'
        working-directory: ${{ matrix.service }}
        run: npm run lint

      - name: Build frontend apps
        if: matrix.service == 'Client' || matrix.service == 'admin'
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Backend dependency check
        if: matrix.service == 'backend'
        working-directory: backend
        run: npm audit --audit-level=high || true

  docker-build:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: tree-planting-backend:ci

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: ./Client
          push: false
          tags: tree-planting-client:ci

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: false
          tags: tree-planting-admin:ci

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check deploy secrets
        id: deploy_gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_KEY" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets missing. Skipping deployment step."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server over SSH
        if: steps.deploy_gate.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            cd ~/tree-project
            git pull origin main
            docker compose down
            docker compose up -d --build
