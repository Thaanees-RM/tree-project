route:
  receiver: email-and-webhook
  group_by:
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: email-and-webhook
    email_configs:
      - to: "you@example.com"
        from: "alertmanager@example.com"
        smarthost: "smtp.example.com:587"
        auth_username: "smtp-user"
        auth_password: "smtp-password"
    webhook_configs:
      - url: "https://your-free-webhook-bridge.example.com/alerts"
        send_resolved: true
